[package]
name = "lemmata-desktop"
version = "0.1.0"
description = "Lemmata: a local research canvas where AI agents work on problems with you"
authors = ["Stepan Vanzuriak"]
license = "MIT"
repository = "https://github.com/stepanvanzuriak/lemmata"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
