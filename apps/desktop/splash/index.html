<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemmata</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f6f6f3;
        --ink: #1b1d22;
        --muted: #6b6f78;
        --accent: #2747c9;
        --line: #dcdcd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #14151a;
          --ink: #ececf0;
          --muted: #9a9ea8;
          --accent: #5b7cff;
          --line: #2c2e36;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(560px, 100% - 48px);
        text-align: center;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .pulse {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }
      }
      #error {
        display: none;
        margin-top: 20px;
        text-align: left;
      }
      #error pre {
        max-height: 220px;
        overflow: auto;
        margin: 8px 0 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font:
          12px/1.45 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--accent)" />
        <g
          stroke="#fff"
          stroke-width="2.6"
          stroke-linecap="round"
          transform="translate(16 16) skewX(-8) translate(-16 -16)"
        >
          <circle cx="16" cy="16" r="9.5" />
          <path d="M5.5 26.5L26.5 5.5" />
        </g>
      </svg>
      <h1>Lemmata</h1>
      <p id="status" class="pulse" role="status">Starting Lemmata...</p>
      <div id="error" role="alert">
        <p id="message"></p>
        <pre id="log"></pre>
      </div>
    </main>
    <script>
      window.lemmataFailed = (message, log) => {
        const status = document.getElementById("status");
        status.textContent = "Lemmata could not start";
        status.classList.remove("pulse");
        document.getElementById("message").textContent = message;
        document.getElementById("log").textContent = log;
        document.getElementById("error").style.display = "block";
      };
    </script>
  </body>
</html>
